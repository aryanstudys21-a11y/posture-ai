<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clinical Posture AI | Sagittal Pipeline</title>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js" crossorigin="anonymous"></script>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700;900&family=Space+Mono:wght@700&display=swap" rel="stylesheet">
  <style>
    :root {
      --cyan: #00f0ff;
      --green: #00ff9d;
      --purple: #b500ff;
      --dark: #050914;
      --glass: rgba(255, 255, 255, 0.03);
      --glass-border: rgba(255, 255, 255, 0.08);
    }
    
    * { box-sizing: border-box; }
    
    body {
      margin: 0;
      padding: 20px;
      min-height: 100vh;
      background-color: var(--dark);
      background-image: 
        radial-gradient(circle at 15% 50%, rgba(0, 240, 255, 0.08), transparent 25%),
        radial-gradient(circle at 85% 30%, rgba(0, 255, 157, 0.08), transparent 25%);
      color: #fff;
      font-family: 'Outfit', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow-x: hidden;
    }

    .orb { position: fixed; border-radius: 50%; filter: blur(80px); z-index: -1; animation: float 10s infinite alternate ease-in-out; }
    .orb-1 { width: 300px; height: 300px; background: rgba(0, 240, 255, 0.15); top: -100px; left: -100px; }
    .orb-2 { width: 400px; height: 400px; background: rgba(0, 255, 157, 0.1); bottom: -150px; right: -100px; animation-delay: -5s; }
    @keyframes float { 0% { transform: translate(0, 0); } 100% { transform: translate(30px, 50px); } }

    .glass-panel {
      background: var(--glass);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid var(--glass-border);
      border-radius: 30px;
      padding: 30px;
      width: 100%;
      max-width: 480px;
      box-shadow: 0 30px 60px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.1);
      display: flex;
      flex-direction: column;
      gap: 24px;
      position: relative;
    }

    .header { text-align: center; }
    .header h1 {
      font-weight: 900;
      font-size: 2rem;
      margin: 0;
      text-transform: uppercase;
      letter-spacing: 2px;
      background: linear-gradient(90deg, #fff, #8a9fc2);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .badge {
      display: inline-block;
      font-family: 'Space Mono', monospace;
      font-size: 0.7rem;
      color: var(--cyan);
      background: rgba(0, 240, 255, 0.1);
      padding: 4px 10px;
      border-radius: 4px;
      border: 1px solid rgba(0, 240, 255, 0.3);
      margin-bottom: 8px;
      letter-spacing: 1px;
    }

    .upload-zone {
      position: relative;
      border: 1px dashed rgba(255, 255, 255, 0.2);
      background: linear-gradient(180deg, rgba(255,255,255,0.02) 0%, rgba(255,255,255,0) 100%);
      border-radius: 20px;
      padding: 20px;
      text-align: center;
      transition: all 0.3s;
      overflow: hidden;
    }
    .upload-zone:hover { border-color: var(--cyan); background: rgba(0, 240, 255, 0.02); }
    .upload-zone input { position: absolute; inset: 0; opacity: 0; cursor: pointer; z-index: 10; }
    .upload-zone .icon { font-size: 24px; margin-bottom: 8px; display: block; opacity: 0.8; }
    .upload-zone .text { font-size: 0.9rem; font-weight: 500; color: #a1b0cb; }

    #hud-display { display: none; }
    
    .data-card {
      background: rgba(0,0,0,0.4);
      border: 1px solid var(--glass-border);
      border-radius: 20px;
      padding: 20px;
      text-align: center;
      position: relative;
      overflow: hidden;
    }
    .data-card::before {
      content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 2px;
      background: linear-gradient(90deg, transparent, var(--green), transparent);
    }
    .data-label { font-size: 0.85rem; color: #8a9fc2; text-transform: uppercase; letter-spacing: 1px; font-weight: 700; margin-bottom: 15px; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 10px;}
    
    .metric-grid {
      display: flex;
      justify-content: space-around;
      align-items: center;
    }
    .metric-title { font-size: 0.8rem; color: #6a7c9c; font-weight: 700; letter-spacing: 1px; margin-bottom: 5px; }
    .metric-value {
      font-family: 'Space Mono', monospace;
      font-size: 2.5rem;
      font-weight: 700;
      line-height: 1;
    }
    #val-cva { color: var(--green); text-shadow: 0 0 20px rgba(0, 255, 157, 0.4); }
    #val-cra { color: var(--cyan); text-shadow: 0 0 20px rgba(0, 240, 255, 0.4); }
    #val-fsa { color: var(--purple); text-shadow: 0 0 20px rgba(181, 0, 255, 0.4); }

    .canvas-container { position: relative; border-radius: 20px; overflow: hidden; border: 1px solid var(--glass-border); background: #000; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
    #outputCanvas { width: 100%; display: block; }
    
    .canvas-container::before, .canvas-container::after { content: ''; position: absolute; width: 20px; height: 20px; border: 2px solid var(--cyan); z-index: 5; pointer-events: none; }
    .canvas-container::before { top: 10px; left: 10px; border-right: none; border-bottom: none; }
    .canvas-container::after { bottom: 10px; right: 10px; border-left: none; border-top: none; }

    .inputs { display: flex; flex-direction: column; gap: 12px; }
    input[type="text"] {
      background: rgba(0,0,0,0.3);
      border: 1px solid var(--glass-border);
      padding: 18px;
      border-radius: 16px;
      color: #fff;
      font-family: 'Space Mono', monospace;
      font-size: 0.9rem;
      outline: none;
      transition: all 0.3s;
    }
    input[type="text"]:focus { border-color: var(--cyan); box-shadow: inset 0 0 10px rgba(0, 240, 255, 0.1); }
    
    button {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--glass-border);
      color: #6a7c9c;
      padding: 18px;
      border-radius: 16px;
      font-size: 1rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      cursor: not-allowed;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
      overflow: hidden;
    }
    button.active {
      background: var(--green);
      color: #000;
      border-color: var(--green);
      cursor: pointer;
      box-shadow: 0 0 20px rgba(0, 255, 157, 0.3);
    }
    button.active:hover { transform: translateY(-2px); box-shadow: 0 10px 25px rgba(0, 255, 157, 0.5); }
    button.active:active { transform: translateY(1px); }
  </style>
</head>
<body>

  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>

  <div class="glass-panel">
    <div class="header">
      <div class="badge">SYS. V 12.0 // FULL SAGITTAL PIPELINE</div>
      <h1>CVA Matrix</h1>
    </div>

    <div class="upload-zone" id="dropArea">
      <span class="icon">⛶</span>
      <span class="text">INITIALIZE MULTI-METRIC SCAN</span>
      <input type="file" id="fileInput" accept="image/*">
    </div>

    <div id="hud-display">
      <div class="data-card" id="dataCard">
        <div class="data-label" id="sideLabel">Awaiting Data</div>
        <div class="metric-grid">
          <div>
            <div class="metric-title">CVA</div>
            <div class="metric-value" id="val-cva">--°</div>
          </div>
          <div>
            <div class="metric-title">CRA</div>
            <div class="metric-value" id="val-cra">--°</div>
          </div>
          <div>
            <div class="metric-title">FSA</div>
            <div class="metric-value" id="val-fsa">--°</div>
          </div>
        </div>
      </div>
      
      <div class="canvas-container">
        <canvas id="outputCanvas"></canvas>
      </div>
    </div>

    <div class="inputs">
      <input type="text" id="patientId" placeholder="SUBJECT_ID (E.G. SUBJ-01)">
      <button id="saveBtn" disabled>Export Full Telemetry</button>
    </div>
  </div>

  <script>
    const fileInput = document.getElementById('fileInput');
    const canvas = document.getElementById('outputCanvas');
    const ctx = canvas.getContext('2d');
    const hud = document.getElementById('hud-display');
    const sideLabel = document.getElementById('sideLabel');
    const valCVA = document.getElementById('val-cva');
    const valCRA = document.getElementById('val-cra');
    const valFSA = document.getElementById('val-fsa');
    const dataCard = document.getElementById('dataCard');
    const saveBtn = document.getElementById('saveBtn');
    const patientIdInput = document.getElementById('patientId');

    let metrics = { cva: null, cra: null, fsa: null, side: null };

    const pose = new Pose({ locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}` });
    
    pose.setOptions({ 
      modelComplexity: 1,         
      smoothLandmarks: false,     
      enableSegmentation: false, 
      minDetectionConfidence: 0.5,
      minTrackingConfidence: 0.5
    });

    pose.onResults((results) => {
      hud.style.display = 'flex';
      hud.style.flexDirection = 'column';
      hud.style.gap = '24px';
      
      canvas.width = results.image.width;
      canvas.height = results.image.height;
      ctx.drawImage(results.image, 0, 0, canvas.width, canvas.height);

      if (results.poseLandmarks) {
        const lm = results.poseLandmarks;
        const rightEar = lm[8], rightShoulder = lm[12], rightEye = lm[5];
        const leftEar = lm[7], leftShoulder = lm[11], leftEye = lm[2];

        const useRightSide = (rightEar.visibility || 0) > (leftEar.visibility || 0);

        const ear = useRightSide ? rightEar : leftEar;
        const shoulder = useRightSide ? rightShoulder : leftShoulder;
        const eye = useRightSide ? rightEye : leftEye;

        const eyeX = eye.x * canvas.width, eyeY = eye.y * canvas.height;
        const tragusX = ear.x * canvas.width, tragusY = ear.y * canvas.height;
        const acroX = shoulder.x * canvas.width, acroY = shoulder.y * canvas.height;
        
        const isFacingLeft = eyeX < tragusX;
        metrics.side = isFacingLeft ? "LEFT" : "RIGHT"; 
        
        const headScale = Math.hypot(eyeX - tragusX, eyeY - tragusY); 

        // CLINICAL C7 BONE TARGETING
        const c7Y = acroY - (headScale * 1.20); 
        const c7X = isFacingLeft ? acroX + (headScale * 0.60) : acroX - (headScale * 0.60); 

        // --- MATH: CALCULATE THE BIG THREE ---
        // 1. CVA: C7 to Tragus (Forward Head)
        metrics.cva = Math.round(Math.atan2(c7Y - tragusY, Math.abs(tragusX - c7X)) * (180 / Math.PI));
        
        // 2. CRA: Tragus to Eye (Head Tilt)
        metrics.cra = Math.round(Math.atan2(tragusY - eyeY, Math.abs(eyeX - tragusX)) * (180 / Math.PI));
        
        // 3. FSA: C7 to Acromion (Shoulder Protraction)
        metrics.fsa = Math.round(Math.atan2(acroY - c7Y, Math.abs(acroX - c7X)) * (180 / Math.PI));

        // --- HIGH-TECH CANVAS DRAWING ---
        ctx.lineWidth = Math.max(2, canvas.width * 0.005);
        const radius = Math.max(5, canvas.width * 0.012);

        // Draw C7 Horizontal Baseline (Dashed)
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.4)';
        ctx.setLineDash([8, 8]);
        ctx.beginPath(); ctx.moveTo(c7X - 150, c7Y); ctx.lineTo(c7X + 150, c7Y); ctx.stroke();
        ctx.setLineDash([]);

        // FSA Vector (Purple: C7 to Acromion)
        ctx.shadowColor = '#b500ff'; ctx.shadowBlur = 10; ctx.strokeStyle = '#b500ff';
        ctx.beginPath(); ctx.moveTo(c7X, c7Y); ctx.lineTo(acroX, acroY); ctx.stroke();

        // CRA Vector (Cyan: Tragus to Eye)
        ctx.shadowColor = '#00f0ff'; ctx.shadowBlur = 10; ctx.strokeStyle = '#00f0ff';
        ctx.beginPath(); ctx.moveTo(tragusX, tragusY); ctx.lineTo(eyeX, eyeY); ctx.stroke();

        // CVA Vector (Green: C7 to Tragus)
        ctx.shadowColor = '#00ff9d'; ctx.shadowBlur = 12; ctx.strokeStyle = '#00ff9d';
        ctx.lineWidth = Math.max(4, canvas.width * 0.008);
        ctx.beginPath(); ctx.moveTo(c7X, c7Y); ctx.lineTo(tragusX, tragusY); ctx.stroke();

        // Plot Nodes
        ctx.shadowBlur = 15; ctx.shadowColor = '#fff'; ctx.fillStyle = '#fff';
        [ {x:c7X, y:c7Y}, {x:tragusX, y:tragusY}, {x:eyeX, y:eyeY}, {x:acroX, y:acroY} ].forEach(pt => {
          ctx.beginPath(); ctx.arc(pt.x, pt.y, radius, 0, 2*Math.PI); ctx.fill();
        });
        ctx.shadowBlur = 0;

        // --- UPDATE HUD ---
        sideLabel.innerText = `BIOMETRIC LOCK: ${metrics.side} PROFILE // FULL SAGITTAL`;
        sideLabel.style.color = '#8a9fc2';
        
        valCVA.innerText = `${metrics.cva}°`;
        valCRA.innerText = `${metrics.cra}°`;
        valFSA.innerText = `${metrics.fsa}°`;
        dataCard.style.borderTopColor = '#00ff9d';

        saveBtn.disabled = false;
        saveBtn.classList.add('active');
      } else {
        sideLabel.innerText = "SYSTEM ERROR: NO SUBJECT DETECTED";
        sideLabel.style.color = '#ff0055';
        valCVA.innerText = "ERR"; valCRA.innerText = "ERR"; valFSA.innerText = "ERR";
        dataCard.style.borderTopColor = '#ff0055';
        saveBtn.disabled = true;
        saveBtn.classList.remove('active');
      }
    });

    fileInput.addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;
      hud.style.display = 'flex';
      hud.style.flexDirection = 'column';
      hud.style.gap = '24px';
      sideLabel.innerText = "CALCULATING MATRICES...";
      valCVA.innerText = "--"; valCRA.innerText = "--"; valFSA.innerText = "--";
      saveBtn.disabled = true;
      saveBtn.classList.remove('active');
      
      const img = new Image();
      img.onload = async () => {
        await pose.reset();
        pose.send({ image: img });
      };
      img.src = URL.createObjectURL(file);
    });

    saveBtn.addEventListener('click', () => {
      if (metrics.cva === null) return;
      const pId = (patientIdInput.value.trim()) || "ANON";
      // Upgraded CSV Exporter
      const csv = `Subject_ID,Profile_Side,CVA_Angle,CRA_Angle,FSA_Angle,Timestamp\n"${pId}","${metrics.side}","${metrics.cva}","${metrics.cra}","${metrics.fsa}","${new Date().toISOString()}"`;
      const blob = new Blob([csv], { type: 'text/csv' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `SAGITTAL_REPORT_${pId}.csv`;
      a.click();

      const originalText = saveBtn.innerText;
      saveBtn.innerText = "TELEMETRY SECURED";
      setTimeout(() => { saveBtn.innerText = originalText; }, 2000);
    });
  </script>
</body>
</html>
