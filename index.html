<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clinical Posture AI</title>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js" crossorigin="anonymous"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #090d16;
      --card-bg: #151d2f;
      --text: #f8fafc;
      --muted: #94a3b8;
      --cyan: #38bdf8;
      --green: #10b981;
      --border: #24324d;
    }
    * { box-sizing: border-box; }
    body {
      font-family: 'Inter', -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 24px 16px;
      display: flex;
      justify-content: center;
      min-height: 100vh;
    }
    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 24px 20px;
      width: 100%;
      max-width: 480px;
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.45);
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    h1 {
      font-size: 1.45rem;
      font-weight: 700;
      margin: 0;
      letter-spacing: -0.02em;
      text-align: center;
    }
    .badge {
      align-self: center;
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--cyan);
      background: rgba(56, 189, 248, 0.12);
      border: 1px solid rgba(56, 189, 248, 0.25);
      border-radius: 999px;
      padding: 4px 12px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .subtitle {
      font-size: 0.9rem;
      color: var(--muted);
      margin: -6px 0 4px;
      text-align: center;
      line-height: 1.4;
    }
    .upload-box {
      position: relative;
      border: 2px dashed var(--cyan);
      background: rgba(56, 189, 248, 0.04);
      border-radius: 14px;
      padding: 20px 16px;
      text-align: center;
      cursor: pointer;
      font-weight: 600;
      color: var(--cyan);
      font-size: 0.95rem;
      transition: background 0.2s;
    }
    .upload-box:active { background: rgba(56, 189, 248, 0.1); }
    .upload-box input {
      position: absolute;
      inset: 0;
      opacity: 0;
      width: 100%;
      height: 100%;
      cursor: pointer;
    }
    #statusBanner {
      display: none;
      font-size: 0.95rem;
      font-weight: 600;
      text-align: center;
      padding: 12px;
      border-radius: 10px;
    }
    #outputCanvas {
      width: 100%;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: #000;
      display: none;
    }
    .form-group {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    input[type="text"] {
      width: 100%;
      padding: 14px;
      background: #0d1322;
      border: 1px solid var(--border);
      border-radius: 10px;
      color: #fff;
      font-size: 0.95rem;
      font-family: inherit;
      outline: none;
    }
    input[type="text"]:focus { border-color: var(--cyan); }
    button#saveBtn {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 10px;
      background: #24324d;
      color: var(--muted);
      font-size: 0.95rem;
      font-weight: 700;
      cursor: not-allowed;
      font-family: inherit;
      transition: all 0.2s;
    }
    button#saveBtn.active {
      background: var(--green);
      color: #fff;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(16, 185, 129, 0.35);
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="badge">Clinical Metric Engine</div>
    <h1>Markerless CVA Analysis</h1>
    <p class="subtitle">Upload a lateral (90° side profile) photo to compute Craniovertebral Angle automatically.</p>

    <div class="upload-box">
      📸 Capture or Upload Photo
      <input type="file" id="fileInput" accept="image/*">
    </div>

    <div id="statusBanner"></div>
    <canvas id="outputCanvas"></canvas>

    <div class="form-group">
      <input type="text" id="patientId" placeholder="Patient / Participant ID (e.g., P01)">
      <button id="saveBtn" disabled>Download CSV Record</button>
    </div>
  </div>

  <script>
    const fileInput = document.getElementById('fileInput');
    const canvas = document.getElementById('outputCanvas');
    const ctx = canvas.getContext('2d');
    const banner = document.getElementById('statusBanner');
    const saveBtn = document.getElementById('saveBtn');
    const patientIdInput = document.getElementById('patientId');

    let currentAngle = null;
    let currentSide = null;

    const pose = new Pose({ locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}` });
    pose.setOptions({ modelComplexity: 1, smoothLandmarks: true, minDetectionConfidence: 0.5, minTrackingConfidence: 0.5 });

    pose.onResults((results) => {
      canvas.style.display = 'block';
      banner.style.display = 'block';
      canvas.width = results.image.width;
      canvas.height = results.image.height;
      ctx.drawImage(results.image, 0, 0, canvas.width, canvas.height);

      if (results.poseLandmarks) {
        const lm = results.poseLandmarks;
        const rightEar = lm[8], rightShoulder = lm[12];
        const leftEar = lm[7], leftShoulder = lm[11];

        const isRight = (rightEar.visibility || 0) >= (leftEar.visibility || 0);
        const ear = isRight ? rightEar : leftEar;
        const shoulder = isRight ? rightShoulder : leftShoulder;
        currentSide = isRight ? "Right" : "Left";

        const ex = ear.x * canvas.width, ey = ear.y * canvas.height;
        const sx = shoulder.x * canvas.width, sy = shoulder.y * canvas.height;

        const dy = sy - ey;
        const dx = Math.abs(ex - sx);
        currentAngle = Math.round(Math.atan2(dy, dx) * (180 / Math.PI));

        // Horizontal baseline reference
        ctx.strokeStyle = '#38bdf8';
        ctx.lineWidth = Math.max(3, canvas.width * 0.005);
        ctx.setLineDash([10, 8]);
        ctx.beginPath(); ctx.moveTo(sx - 200, sy); ctx.lineTo(sx + 200, sy); ctx.stroke();
        ctx.setLineDash([]);

        // Tragus-to-shoulder vector
        ctx.strokeStyle = '#10b981';
        ctx.lineWidth = Math.max(4, canvas.width * 0.008);
        ctx.beginPath(); ctx.moveTo(ex, ey); ctx.lineTo(sx, sy); ctx.stroke();

        // Keypoints
        const radius = Math.max(7, canvas.width * 0.012);
        ctx.fillStyle = '#ef4444';
        ctx.beginPath(); ctx.arc(ex, ey, radius, 0, 2*Math.PI); ctx.fill();
        ctx.beginPath(); ctx.arc(sx, sy, radius, 0, 2*Math.PI); ctx.fill();

        banner.style.background = 'rgba(16, 185, 129, 0.12)';
        banner.style.border = '1px solid rgba(16, 185, 129, 0.3)';
        banner.style.color = '#10b981';
        banner.innerText = `Detected ${currentSide} Profile | CVA: ${currentAngle}°`;

        saveBtn.disabled = false;
        saveBtn.classList.add('active');
        saveBtn.innerText = "Download CSV Record";
      } else {
        banner.style.background = 'rgba(239, 68, 68, 0.12)';
        banner.style.border = '1px solid rgba(239, 68, 68, 0.3)';
        banner.style.color = '#ef4444';
        banner.innerText = "No landmarks detected. Keep ear and shoulder clear.";
        saveBtn.disabled = true;
        saveBtn.classList.remove('active');
      }
    });

    fileInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      banner.style.display = 'block';
      banner.style.background = 'rgba(56, 189, 248, 0.12)';
      banner.style.border = '1px solid rgba(56, 189, 248, 0.3)';
      banner.style.color = '#38bdf8';
      banner.innerText = "Processing landmarks with MediaPipe...";
      saveBtn.disabled = true;
      saveBtn.classList.remove('active');
      const img = new Image();
      img.onload = () => pose.send({ image: img });
      img.src = URL.createObjectURL(file);
    });

    saveBtn.addEventListener('click', () => {
      if (currentAngle === null) return;
      const pId = (patientIdInput.value.trim()) || "Anonymous";
      const csv = `Patient_ID,Side,CVA_Angle,Timestamp\n"${pId}","${currentSide}","${currentAngle}","${new Date().toISOString()}"`;
      const blob = new Blob([csv], { type: 'text/csv' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `CVA_${pId}.csv`;
      a.click();

      saveBtn.innerText = "Saved to Downloads";
      setTimeout(() => { saveBtn.innerText = "Download CSV Record"; }, 2500);
    });
  </script>
</body>
</html>
