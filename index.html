<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clinical Posture AI | Sagittal Pipeline</title>
  
  <!-- MediaPipe -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js" crossorigin="anonymous"></script>
  <!-- jsPDF for Clinical Reporting -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700;900&family=Space+Mono:wght@700&display=swap" rel="stylesheet">
  <style>
    :root {
      --cyan: #00f0ff;
      --green: #00ff9d;
      --dark: #050914;
      --glass: rgba(255, 255, 255, 0.03);
      --glass-border: rgba(255, 255, 255, 0.08);
    }
    
    * { box-sizing: border-box; }
    
    body {
      margin: 0;
      padding: 20px;
      min-height: 100vh;
      background-color: var(--dark);
      background-image: 
        radial-gradient(circle at 15% 50%, rgba(0, 240, 255, 0.08), transparent 25%),
        radial-gradient(circle at 85% 30%, rgba(0, 255, 157, 0.08), transparent 25%);
      color: #fff;
      font-family: 'Outfit', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow-x: hidden;
    }

    .orb { position: fixed; border-radius: 50%; filter: blur(80px); z-index: -1; animation: float 10s infinite alternate ease-in-out; }
    .orb-1 { width: 300px; height: 300px; background: rgba(0, 240, 255, 0.15); top: -100px; left: -100px; }
    .orb-2 { width: 400px; height: 400px; background: rgba(0, 255, 157, 0.1); bottom: -150px; right: -100px; animation-delay: -5s; }
    @keyframes float { 0% { transform: translate(0, 0); } 100% { transform: translate(30px, 50px); } }

    .glass-panel {
      background: var(--glass);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid var(--glass-border);
      border-radius: 30px;
      padding: 30px;
      width: 100%;
      max-width: 480px;
      box-shadow: 0 30px 60px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.1);
      display: flex;
      flex-direction: column;
      gap: 24px;
      position: relative;
    }

    .header { text-align: center; }
    .header h1 {
      font-weight: 900;
      font-size: 2rem;
      margin: 0;
      text-transform: uppercase;
      letter-spacing: 2px;
      background: linear-gradient(90deg, #fff, #8a9fc2);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .badge {
      display: inline-block;
      font-family: 'Space Mono', monospace;
      font-size: 0.7rem;
      color: var(--cyan);
      background: rgba(0, 240, 255, 0.1);
      padding: 4px 10px;
      border-radius: 4px;
      border: 1px solid rgba(0, 240, 255, 0.3);
      margin-bottom: 8px;
      letter-spacing: 1px;
    }

    .upload-zone {
      position: relative;
      border: 1px dashed rgba(255, 255, 255, 0.2);
      background: linear-gradient(180deg, rgba(255,255,255,0.02) 0%, rgba(255,255,255,0) 100%);
      border-radius: 20px;
      padding: 20px;
      text-align: center;
      transition: all 0.3s;
      overflow: hidden;
    }
    .upload-zone:hover { border-color: var(--cyan); background: rgba(0, 240, 255, 0.02); }
    .upload-zone input { position: absolute; inset: 0; opacity: 0; cursor: pointer; z-index: 10; }
    .upload-zone .icon { font-size: 24px; margin-bottom: 8px; display: block; opacity: 0.8; }
    .upload-zone .text { font-size: 0.9rem; font-weight: 500; color: #a1b0cb; }

    #hud-display { display: none; }
    
    .data-card {
      background: rgba(0,0,0,0.4);
      border: 1px solid var(--glass-border);
      border-radius: 20px;
      padding: 20px;
      text-align: center;
      position: relative;
      overflow: hidden;
    }
    .data-card::before {
      content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 2px;
      background: linear-gradient(90deg, transparent, var(--green), transparent);
    }
    .data-label { font-size: 0.85rem; color: #8a9fc2; text-transform: uppercase; letter-spacing: 1px; font-weight: 700; margin-bottom: 15px; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 10px;}
    
    .metric-grid {
      display: flex;
      justify-content: space-around;
      align-items: center;
    }
    .metric-title { font-size: 0.8rem; color: #6a7c9c; font-weight: 700; letter-spacing: 1px; margin-bottom: 5px; }
    .metric-value {
      font-family: 'Space Mono', monospace;
      font-size: 3rem;
      font-weight: 700;
      line-height: 1;
    }
    #val-sha { color: var(--green); text-shadow: 0 0 20px rgba(0, 255, 157, 0.4); }
    #val-cra { color: var(--cyan); text-shadow: 0 0 20px rgba(0, 240, 255, 0.4); }

    .canvas-container { position: relative; border-radius: 20px; overflow: hidden; border: 1px solid var(--glass-border); background: #000; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
    #outputCanvas { width: 100%; display: block; }
    
    .canvas-container::before, .canvas-container::after { content: ''; position: absolute; width: 20px; height: 20px; border: 2px solid var(--cyan); z-index: 5; pointer-events: none; }
    .canvas-container::before { top: 10px; left: 10px; border-right: none; border-bottom: none; }
    .canvas-container::after { bottom: 10px; right: 10px; border-left: none; border-top: none; }

    .inputs { display: flex; flex-direction: column; gap: 12px; }
    input[type="text"] {
      background: rgba(0,0,0,0.3);
      border: 1px solid var(--glass-border);
      padding: 18px;
      border-radius: 16px;
      color: #fff;
      font-family: 'Space Mono', monospace;
      font-size: 0.9rem;
      outline: none;
      transition: all 0.3s;
    }
    input[type="text"]:focus { border-color: var(--cyan); box-shadow: inset 0 0 10px rgba(0, 240, 255, 0.1); }
    
    button {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--glass-border);
      color: #6a7c9c;
      padding: 18px;
      border-radius: 16px;
      font-size: 1rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      cursor: not-allowed;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
      overflow: hidden;
    }
    button.active {
      background: var(--green);
      color: #000;
      border-color: var(--green);
      cursor: pointer;
      box-shadow: 0 0 20px rgba(0, 255, 157, 0.3);
    }
    button.active:hover { transform: translateY(-2px); box-shadow: 0 10px 25px rgba(0, 255, 157, 0.5); }
    button.active:active { transform: translateY(1px); }
  </style>
</head>
<body>

  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>

  <div class="glass-panel">
    <div class="header">
      <div class="badge">SYS. V 14.0 // CLINICAL PDF GENERATOR</div>
      <h1>SAGITTAL MATRIX</h1>
    </div>

    <div class="upload-zone" id="dropArea">
      <span class="icon">⛶</span>
      <span class="text">INITIALIZE DIAGNOSTIC SCAN</span>
      <input type="file" id="fileInput" accept="image/*">
    </div>

    <div id="hud-display">
      <div class="data-card" id="dataCard">
        <div class="data-label" id="sideLabel">Awaiting Data</div>
        <div class="metric-grid">
          <div>
            <div class="metric-title">SHA (HEAD POSTURE)</div>
            <div class="metric-value" id="val-sha">--°</div>
          </div>
          <div>
            <div class="metric-title">CRA (HEAD TILT)</div>
            <div class="metric-value" id="val-cra">--°</div>
          </div>
        </div>
      </div>
      
      <div class="canvas-container">
        <canvas id="outputCanvas"></canvas>
      </div>
    </div>

    <div class="inputs">
      <input type="text" id="patientId" placeholder="SUBJECT_ID (E.G. SUBJ-01)">
      <button id="saveBtn" disabled>Generate Clinical PDF</button>
    </div>
  </div>

  <script>
    const fileInput = document.getElementById('fileInput');
    const canvas = document.getElementById('outputCanvas');
    const ctx = canvas.getContext('2d');
    const hud = document.getElementById('hud-display');
    const sideLabel = document.getElementById('sideLabel');
    const valSHA = document.getElementById('val-sha');
    const valCRA = document.getElementById('val-cra');
    const dataCard = document.getElementById('dataCard');
    const saveBtn = document.getElementById('saveBtn');
    const patientIdInput = document.getElementById('patientId');

    let metrics = { sha: null, cra: null, side: null };

    const pose = new Pose({ locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}` });
    
    pose.setOptions({ 
      modelComplexity: 1,         
      smoothLandmarks: false,     
      enableSegmentation: false, 
      minDetectionConfidence: 0.2, 
      minTrackingConfidence: 0.2
    });

    pose.onResults((results) => {
      hud.style.display = 'flex';
      hud.style.flexDirection = 'column';
      hud.style.gap = '24px';
      
      canvas.width = results.image.width;
      canvas.height = results.image.height;
      ctx.drawImage(results.image, 0, 0, canvas.width, canvas.height);

      if (results.poseLandmarks) {
        const lm = results.poseLandmarks;
        const rightEar = lm[8], rightShoulder = lm[12], rightEye = lm[5];
        const leftEar = lm[7], leftShoulder = lm[11], leftEye = lm[2];

        const useRightSide = (rightEar.visibility || 0) > (leftEar.visibility || 0);

        const ear = useRightSide ? rightEar : leftEar;
        const shoulder = useRightSide ? rightShoulder : leftShoulder;
        const eye = useRightSide ? rightEye : leftEye;

        // PURE DIRECT MAPPING 
        const eyeX = eye.x * canvas.width, eyeY = eye.y * canvas.height;
        const tragusX = ear.x * canvas.width, tragusY = ear.y * canvas.height;
        const acroX = shoulder.x * canvas.width, acroY = shoulder.y * canvas.height;
        
        const isFacingLeft = eyeX < tragusX;
        metrics.side = isFacingLeft ? "LEFT" : "RIGHT"; 

        // --- SHA & CRA CALCULATION ---
        const shaDx = Math.abs(tragusX - acroX);
        const shaDy = acroY - tragusY;
        metrics.sha = Math.round(Math.atan2(shaDy, shaDx) * (180 / Math.PI));
        
        const craDx = Math.abs(eyeX - tragusX);
        const craDy = tragusY - eyeY;
        metrics.cra = Math.round(Math.atan2(craDy, craDx) * (180 / Math.PI));

        // --- CANVAS OVERLAY DRAWING ---
        ctx.lineWidth = Math.max(2, canvas.width * 0.005);
        const radius = Math.max(5, canvas.width * 0.012);

        ctx.strokeStyle = 'rgba(255, 255, 255, 0.4)';
        ctx.setLineDash([8, 8]);
        ctx.beginPath(); ctx.moveTo(acroX - 150, acroY); ctx.lineTo(acroX + 150, acroY); ctx.stroke();
        ctx.setLineDash([]);

        ctx.shadowColor = '#00f0ff'; ctx.shadowBlur = 10; ctx.strokeStyle = '#00f0ff';
        ctx.beginPath(); ctx.moveTo(tragusX, tragusY); ctx.lineTo(eyeX, eyeY); ctx.stroke();

        ctx.shadowColor = '#00ff9d'; ctx.shadowBlur = 12; ctx.strokeStyle = '#00ff9d';
        ctx.lineWidth = Math.max(4, canvas.width * 0.008);
        ctx.beginPath(); ctx.moveTo(acroX, acroY); ctx.lineTo(tragusX, tragusY); ctx.stroke();

        ctx.shadowBlur = 15; ctx.shadowColor = '#fff'; ctx.fillStyle = '#fff';
        [ {x:acroX, y:acroY}, {x:tragusX, y:tragusY}, {x:eyeX, y:eyeY} ].forEach(pt => {
          ctx.beginPath(); ctx.arc(pt.x, pt.y, radius, 0, 2*Math.PI); ctx.fill();
        });
        ctx.shadowBlur = 0;

        // --- UPDATE HUD ---
        sideLabel.innerText = `BIOMETRIC LOCK: ${metrics.side} PROFILE`;
        sideLabel.style.color = '#8a9fc2';
        
        valSHA.innerText = `${metrics.sha}°`;
        valCRA.innerText = `${metrics.cra}°`;
        dataCard.style.borderTopColor = '#00ff9d';

        saveBtn.disabled = false;
        saveBtn.classList.add('active');
      } else {
        sideLabel.innerText = "SYSTEM ERROR: NO SUBJECT DETECTED";
        sideLabel.style.color = '#ff0055';
        valSHA.innerText = "ERR"; valCRA.innerText = "ERR";
        dataCard.style.borderTopColor = '#ff0055';
        saveBtn.disabled = true;
        saveBtn.classList.remove('active');
      }
    });

    fileInput.addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;
      hud.style.display = 'flex';
      hud.style.flexDirection = 'column';
      hud.style.gap = '24px';
      sideLabel.innerText = "CALCULATING MATRICES...";
      valSHA.innerText = "--"; valCRA.innerText = "--"; 
      saveBtn.disabled = true;
      saveBtn.classList.remove('active');
      
      const img = new Image();
      img.onload = async () => {
        await pose.reset();
        pose.send({ image: img });
      };
      img.src = URL.createObjectURL(file);
    });

    // --- PHASE 1: AUTOMATED PDF GENERATION ---
    saveBtn.addEventListener('click', () => {
      if (metrics.sha === null) return;
      
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF();
      const pId = (patientIdInput.value.trim()) || "ANON";
      const dateStr = new Date().toLocaleString();

      // Clinical Diagnosis Logic
      let severity = "Normal Alignment";
      if (metrics.sha < 50) severity = "Mild Forward Head Posture (FHP)";
      if (metrics.sha < 45) severity = "Moderate Forward Head Posture (FHP)";
      if (metrics.sha < 40) severity = "Severe Forward Head Posture (FHP)";

      // PDF Header
      doc.setFont("helvetica", "bold");
      doc.setFontSize(22);
      doc.text("Automated Postural Analysis Report", 20, 20);
      
      doc.setFont("helvetica", "normal");
      doc.setFontSize(12);
      doc.text(`Subject ID: ${pId}`, 20, 30);
      doc.text(`Timestamp: ${dateStr}`, 20, 37);
      doc.text(`Profile Validated: ${metrics.side} Sagittal`, 20, 44);

      // Embed the Canvas Image with Overlays
      const imgData = canvas.toDataURL('image/jpeg', 1.0);
      const pdfWidth = 170; // mm
      const pdfHeight = (canvas.height / canvas.width) * pdfWidth;
      
      doc.addImage(imgData, 'JPEG', 20, 55, pdfWidth, pdfHeight);

      // Diagnostic Metrics Section
      const textY = 55 + pdfHeight + 15;
      
      doc.setFont("helvetica", "bold");
      doc.setFontSize(16);
      doc.text("Clinical Matrices", 20, textY);
      
      doc.setFont("helvetica", "normal");
      doc.setFontSize(12);
      doc.text(`Sagittal Head Angle (SHA): ${metrics.sha}° (Normative: > 50°)`, 20, textY + 10);
      doc.text(`Cranial Angle (CRA): ${metrics.cra}°`, 20, textY + 17);
      
      doc.setFont("helvetica", "bold");
      doc.text(`Diagnostic Status: ${severity}`, 20, textY + 27);

      doc.save(`Posture_Report_${pId}.pdf`);

      const originalText = saveBtn.innerText;
      saveBtn.innerText = "PDF GENERATED";
      setTimeout(() => { saveBtn.innerText = originalText; }, 2000);
    });
  </script>
</body>
</html>
