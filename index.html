<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clinical Posture AI</title>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js" crossorigin="anonymous"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #030712;
      --card-bg: #111827;
      --text: #f8fafc;
      --muted: #94a3b8;
      --cyan: #06b6d4;
      --cyan-glow: rgba(6, 182, 212, 0.4);
      --green: #10b981;
      --border: #1f2937;
    }
    * { box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
    body {
      background: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 24px 16px;
      display: flex;
      justify-content: center;
      min-height: 100vh;
      background-image: radial-gradient(circle at 50% 0%, #1e293b 0%, transparent 70%);
    }
    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 32px 24px;
      width: 100%;
      max-width: 480px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    h1 {
      font-size: 1.75rem;
      font-weight: 800;
      margin: 0;
      text-align: center;
      background: linear-gradient(to right, #fff, #94a3b8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .badge {
      align-self: center;
      font-size: 0.75rem;
      font-weight: 800;
      color: var(--cyan);
      background: rgba(6, 182, 212, 0.1);
      border: 1px solid rgba(6, 182, 212, 0.3);
      border-radius: 8px;
      padding: 6px 14px;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      box-shadow: 0 0 15px var(--cyan-glow);
    }
    .upload-box {
      position: relative;
      border: 2px dashed rgba(6, 182, 212, 0.5);
      background: rgba(6, 182, 212, 0.03);
      border-radius: 16px;
      padding: 24px 16px;
      text-align: center;
      cursor: pointer;
      font-weight: 600;
      color: var(--cyan);
      font-size: 1rem;
      transition: all 0.3s ease;
    }
    .upload-box:hover {
      background: rgba(6, 182, 212, 0.08);
      border-color: var(--cyan);
      box-shadow: 0 0 20px var(--cyan-glow);
    }
    .upload-box input {
      position: absolute;
      inset: 0;
      opacity: 0;
      width: 100%;
      height: 100%;
      cursor: pointer;
    }
    #statusBanner {
      display: none;
      text-align: center;
      padding: 20px;
      border-radius: 16px;
      background: rgba(16, 185, 129, 0.1);
      border: 1px solid rgba(16, 185, 129, 0.3);
    }
    .cva-number {
      display: block;
      font-size: 3.5rem;
      font-weight: 800;
      color: var(--green);
      line-height: 1;
      text-shadow: 0 0 20px rgba(16, 185, 129, 0.5);
      margin-top: 8px;
    }
    #outputCanvas {
      width: 100%;
      border-radius: 16px;
      border: 1px solid var(--border);
      background: #000;
      display: none;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }
    .form-group {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: 10px;
    }
    input[type="text"] {
      width: 100%;
      padding: 16px;
      background: #1f2937;
      border: 1px solid #374151;
      border-radius: 12px;
      color: #fff;
      font-size: 1rem;
      outline: none;
      transition: border 0.3s;
    }
    input[type="text"]:focus {
      border-color: var(--cyan);
      box-shadow: 0 0 0 3px rgba(6, 182, 212, 0.2);
    }
    button#saveBtn {
      width: 100%;
      padding: 18px;
      border: none;
      border-radius: 12px;
      background: #1f2937;
      color: #6b7280;
      font-size: 1.1rem;
      font-weight: 800;
      cursor: not-allowed;
      transition: all 0.3s ease;
    }
    button#saveBtn.active {
      background: linear-gradient(135deg, #10b981 0%, #059669 100%);
      color: #fff;
      cursor: pointer;
      box-shadow: 0 10px 25px rgba(16, 185, 129, 0.4);
    }
    button#saveBtn.active:active {
      transform: scale(0.98);
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="badge">AI Diagnostic Engine</div>
    <h1>Markerless CVA</h1>

    <div class="upload-box">
      <span style="font-size:1.2rem; display:block; margin-bottom:8px;">📸</span>
      Tap to Capture or Upload Profile
      <input type="file" id="fileInput" accept="image/*">
    </div>

    <div id="statusBanner"></div>
    <canvas id="outputCanvas"></canvas>

    <div class="form-group">
      <input type="text" id="patientId" placeholder="Participant ID (e.g., Subj-001)">
      <button id="saveBtn" disabled>Export CSV Record</button>
    </div>
  </div>

  <script>
    const fileInput = document.getElementById('fileInput');
    const canvas = document.getElementById('outputCanvas');
    const ctx = canvas.getContext('2d');
    const banner = document.getElementById('statusBanner');
    const saveBtn = document.getElementById('saveBtn');
    const patientIdInput = document.getElementById('patientId');

    let currentAngle = null;
    let currentSide = null;

    const pose = new Pose({ locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}` });
    pose.setOptions({ modelComplexity: 1, smoothLandmarks: true, minDetectionConfidence: 0.5, minTrackingConfidence: 0.5 });

    pose.onResults((results) => {
      canvas.style.display = 'block';
      banner.style.display = 'block';
      canvas.width = results.image.width;
      canvas.height = results.image.height;
      ctx.drawImage(results.image, 0, 0, canvas.width, canvas.height);

      if (results.poseLandmarks) {
        const lm = results.poseLandmarks;
        const rightEar = lm[8], rightShoulder = lm[12];
        const leftEar = lm[7], leftShoulder = lm[11];

        const isRight = (rightEar.visibility || 0) >= (leftEar.visibility || 0);
        const ear = isRight ? rightEar : leftEar;
        const shoulder = isRight ? rightShoulder : leftShoulder;
        currentSide = isRight ? "Right" : "Left";

        const ex = ear.x * canvas.width, ey = ear.y * canvas.height;
        const sx = shoulder.x * canvas.width, sy = shoulder.y * canvas.height;

        const dy = sy - ey;
        const dx = Math.abs(ex - sx);
        currentAngle = Math.round(Math.atan2(dy, dx) * (180 / Math.PI));

        // Add Neon Glow to lines
        ctx.shadowColor = '#06b6d4';
        ctx.shadowBlur = 15;

        // Horizontal baseline reference
        ctx.strokeStyle = '#06b6d4';
        ctx.lineWidth = Math.max(3, canvas.width * 0.005);
        ctx.setLineDash([12, 10]);
        ctx.beginPath(); ctx.moveTo(sx - 200, sy); ctx.lineTo(sx + 200, sy); ctx.stroke();
        ctx.setLineDash([]);

        // Tragus-to-shoulder vector
        ctx.shadowColor = '#10b981';
        ctx.strokeStyle = '#10b981';
        ctx.lineWidth = Math.max(5, canvas.width * 0.008);
        ctx.beginPath(); ctx.moveTo(ex, ey); ctx.lineTo(sx, sy); ctx.stroke();

        // Keypoints
        ctx.shadowBlur = 20;
        ctx.shadowColor = '#ef4444';
        const radius = Math.max(8, canvas.width * 0.015);
        ctx.fillStyle = '#ef4444';
        ctx.beginPath(); ctx.arc(ex, ey, radius, 0, 2*Math.PI); ctx.fill();
        ctx.beginPath(); ctx.arc(sx, sy, radius, 0, 2*Math.PI); ctx.fill();
        
        // Reset shadow
        ctx.shadowBlur = 0;

        // Render massive CVA Number
        banner.style.background = 'rgba(16, 185, 129, 0.05)';
        banner.style.borderColor = 'rgba(16, 185, 129, 0.2)';
        banner.innerHTML = `<span style="color:#94a3b8; font-weight:600;">Detected ${currentSide} Profile</span><span class="cva-number">${currentAngle}°</span>`;

        saveBtn.disabled = false;
        saveBtn.classList.add('active');
        saveBtn.innerText = "Export CSV Record";
      } else {
        banner.style.background = 'rgba(239, 68, 68, 0.05)';
        banner.style.borderColor = 'rgba(239, 68, 68, 0.2)';
        banner.innerHTML = `<span style="color:#ef4444; font-weight:600;">⚠️ No landmarks detected.<br>Ensure full shoulder is visible.</span>`;
        saveBtn.disabled = true;
        saveBtn.classList.remove('active');
      }
    });

    fileInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      banner.style.display = 'block';
      banner.style.background = 'rgba(6, 182, 212, 0.05)';
      banner.style.borderColor = 'rgba(6, 182, 212, 0.2)';
      banner.innerHTML = `<span style="color:#06b6d4; font-weight:600;">Scanning Biomechanics...</span>`;
      saveBtn.disabled = true;
      saveBtn.classList.remove('active');
      const img = new Image();
      img.onload = () => pose.send({ image: img });
      img.src = URL.createObjectURL(file);
    });

    saveBtn.addEventListener('click', () => {
      if (currentAngle === null) return;
      const pId = (patientIdInput.value.trim()) || "Anonymous";
      const csv = `Patient_ID,Side,CVA_Angle,Timestamp\n"${pId}","${currentSide}","${currentAngle}","${new Date().toISOString()}"`;
      const blob = new Blob([csv], { type: 'text/csv' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `CVA_${pId}.csv`;
      a.click();

      const originalText = saveBtn.innerText;
      saveBtn.innerText = "✓ Saved Successfully";
      setTimeout(() => { saveBtn.innerText = originalText; }, 2000);
    });
  </script>
</body>
</html>
