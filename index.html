<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clinical Posture AI | Virtual C7 Matrix</title>
  
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/holistic/holistic.js" crossorigin="anonymous"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700;900&family=Space+Mono:wght@700&display=swap" rel="stylesheet">
  <style>
    :root {
      --cyan: #00f0ff;
      --green: #00ff9d;
      --magenta: #ff00ff;
      --red: #ff3366;
      --dark: #050914;
      --glass: rgba(255, 255, 255, 0.03);
      --glass-border: rgba(255, 255, 255, 0.08);
    }
    
    * { box-sizing: border-box; }
    
    body {
      margin: 0;
      padding: 10px;
      min-height: 100vh;
      background-color: var(--dark);
      background-image: 
        radial-gradient(circle at 15% 50%, rgba(0, 240, 255, 0.08), transparent 25%),
        radial-gradient(circle at 85% 30%, rgba(0, 255, 157, 0.08), transparent 25%);
      color: #fff;
      font-family: 'Outfit', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow-x: hidden;
    }

    .glass-panel {
      background: var(--glass);
      backdrop-filter: blur(24px);
      border: 1px solid var(--glass-border);
      border-radius: 20px;
      padding: 20px;
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .header { text-align: center; }
    .header h1 { font-weight: 900; font-size: 1.8rem; margin: 0; background: linear-gradient(90deg, #fff, #8a9fc2); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .badge { display: inline-block; font-family: 'Space Mono', monospace; font-size: 0.7rem; color: var(--cyan); background: rgba(0, 240, 255, 0.1); padding: 4px 10px; border-radius: 4px; border: 1px solid rgba(0, 240, 255, 0.3); margin-bottom: 5px; }
    
    .view-toggles { display: flex; gap: 10px; }
    .view-btn { flex: 1; background: rgba(0,0,0,0.3); border: 1px solid var(--glass-border); color: #8a9fc2; padding: 12px; border-radius: 12px; font-size: 0.8rem; font-weight: 700; cursor: pointer; transition: 0.3s; }
    .view-btn.active { background: rgba(0, 255, 157, 0.1); border-color: var(--green); color: var(--green); }

    .upload-zone { position: relative; border: 1px dashed rgba(255, 255, 255, 0.2); background: linear-gradient(180deg, rgba(255,255,255,0.02) 0%, rgba(255,255,255,0) 100%); border-radius: 16px; padding: 20px; text-align: center; cursor: pointer; transition: 0.3s; }
    .upload-zone input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
    
    .canvas-container { position: relative; border-radius: 16px; overflow: hidden; border: 1px solid var(--glass-border); background: #000; display: none; }
    #outputCanvas { width: 100%; display: block; }
    
    #warningBanner { display: none; background: rgba(255, 51, 102, 0.2); color: var(--red); border: 1px solid var(--red); padding: 10px; border-radius: 8px; text-align: center; font-size: 0.8rem; font-weight: bold; font-family: 'Space Mono', monospace; letter-spacing: 1px; }

    .metric-grid { display: flex; justify-content: space-between; background: rgba(0,0,0,0.4); border: 1px solid var(--glass-border); border-radius: 16px; padding: 15px; text-align: center; flex-wrap: wrap; gap: 10px;}
    .metric-grid > div { flex: 1; min-width: 30%; }
    .metric-title { font-size: 0.65rem; color: #8a9fc2; font-weight: 700; height: 15px; text-transform: uppercase;}
    .metric-value { font-family: 'Space Mono', monospace; font-size: 1.6rem; font-weight: 700; color: #fff; }
    
    #val-1 { color: var(--green); }
    #val-2 { color: var(--cyan); }
    #val-conf { color: var(--green); }
    #val-conf.low { color: var(--red); }

    input[type="text"], button.export-btn { background: rgba(0,0,0,0.3); border: 1px solid var(--glass-border); padding: 15px; border-radius: 12px; color: #fff; width: 100%; font-family: 'Space Mono', monospace; font-size: 0.9rem; outline: none; }
    button.export-btn { font-family: 'Outfit', sans-serif; font-weight: 700; text-transform: uppercase; cursor: not-allowed; color: #6a7c9c; transition: 0.3s; margin-top: 10px; }
    button.export-btn.active { background: var(--green); color: #000; border-color: var(--green); cursor: pointer; }
    button.export-btn.error { background: rgba(255, 51, 102, 0.1); border-color: var(--red); color: var(--red); }
  </style>
</head>
<body>

  <div class="glass-panel">
    <div class="header">
      <div class="badge">SYS. V 28.1 // VIRTUAL C7 ANDROID PORT</div>
      <h1>POSTURE AI</h1>
    </div>
    
    <div class="view-toggles">
      <button class="view-btn active" id="viewSagittal">SAGITTAL</button>
      <button class="view-btn" id="viewCoronal">CORONAL</button>
    </div>

    <div class="upload-zone" id="dropArea">
      <span style="font-size: 1.5rem; display:block; margin-bottom:5px;">⛶</span>
      <span style="font-size: 0.8rem; font-weight: 700; color:#a1b0cb;">TAP TO LOAD CALIBRATION IMAGE</span>
      <input type="file" id="fileInput" accept="image/*">
    </div>

    <div id="warningBanner">⚠ INTERFERENCE DETECTED: ADJUST LIGHTING OR CLOTHING</div>

    <div class="canvas-container" id="canvasWrap">
      <canvas id="outputCanvas"></canvas>
    </div>

    <div class="metric-grid">
      <div>
        <div class="metric-title" id="lbl-1">CVA (HEAD)</div>
        <div class="metric-value" id="val-1">--°</div>
      </div>
      <div>
        <div class="metric-title" id="lbl-2">DISPLACEMENT</div>
        <div class="metric-value" id="val-2">--</div>
      </div>
      <div>
        <div class="metric-title">CONFIDENCE</div>
        <div class="metric-value" id="val-conf">--%</div>
      </div>
    </div>

    <div>
      <input type="text" id="patientId" placeholder="SUBJECT_ID (E.G. SUBJ-01)">
      <button id="saveBtn" class="export-btn" disabled>AWAITING DATA</button>
    </div>
  </div>

  <script>
    const fileInput = document.getElementById('fileInput');
    const canvas = document.getElementById('outputCanvas');
    const ctx = canvas.getContext('2d');
    const canvasWrap = document.getElementById('canvasWrap');
    const warningBanner = document.getElementById('warningBanner');
    
    const viewSagittal = document.getElementById('viewSagittal');
    const viewCoronal = document.getElementById('viewCoronal');
    
    const lbl1 = document.getElementById('lbl-1');
    const lbl2 = document.getElementById('lbl-2');
    const val1 = document.getElementById('val-1');
    const val2 = document.getElementById('val-2');
    const valConf = document.getElementById('val-conf');
    const saveBtn = document.getElementById('saveBtn');
    const patientIdInput = document.getElementById('patientId');

    let currentMode = 'SAGITTAL';
    let metrics = { m1: null, m2: null, side: null, raw1: 0, raw2: 0, confidence: 0 };
    let rawNodes = {};

    const holistic = new Holistic({ locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/holistic/${file}` });
    holistic.setOptions({
      modelComplexity: 1,
      smoothLandmarks: true,
      enableSegmentation: false,
      refineFaceLandmarks: true,
      minDetectionConfidence: 0.5,
      minTrackingConfidence: 0.5
    });

    viewSagittal.onclick = () => { currentMode = 'SAGITTAL'; viewSagittal.classList.add('active'); viewCoronal.classList.remove('active'); updateLabels(); resetMetrics(); };
    viewCoronal.onclick = () => { currentMode = 'CORONAL'; viewCoronal.classList.add('active'); viewSagittal.classList.remove('active'); updateLabels(); resetMetrics(); };
    
    function updateLabels() {
      if(currentMode === 'SAGITTAL') {
        lbl1.innerText = "CVA (HEAD)"; lbl2.innerText = "DISPLACEMENT";
      } else {
        lbl1.innerText = "SHOULDER SLOPE"; lbl2.innerText = "ASYMMETRY IDX";
      }
    }

    function resetMetrics() {
      val1.innerText = "--°"; val2.innerText = "--"; valConf.innerText = "--%";
      valConf.classList.remove('low'); warningBanner.style.display = 'none';
      saveBtn.disabled = true; saveBtn.className = 'export-btn'; saveBtn.innerText = "AWAITING DATA";
      metrics = { m1: null, m2: null, side: null, confidence: 0 };
    }

    fileInput.addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;
      canvasWrap.style.display = 'block';
      const img = new Image();
      img.onload = async () => { await holistic.reset(); holistic.send({ image: img }); };
      img.src = URL.createObjectURL(file);
    });

    holistic.onResults((results) => {
      canvas.width = results.image.width; canvas.height = results.image.height;
      ctx.drawImage(results.image, 0, 0, canvas.width, canvas.height);

      if (results.poseLandmarks && results.faceLandmarks) {
        const poseLms = results.poseLandmarks;
        const faceLms = results.faceLandmarks;
        ctx.lineWidth = Math.max(2, canvas.width * 0.005);
        const radius = Math.max(5, canvas.width * 0.012);
        
        let minConfidence = 1.0;

        if (currentMode === 'SAGITTAL') {
          const rShoulder = poseLms[12], lShoulder = poseLms[11];
          const rHip = poseLms[24], lHip = poseLms[23];
          
          const rTragus = faceLms[234], lTragus = faceLms[454];

          const useRightSide = (rShoulder.visibility || 0) > (lShoulder.visibility || 0);
          
          minConfidence = useRightSide ? rShoulder.visibility : lShoulder.visibility;

          // 1. Calculate Virtual C7 Spine Node
          const spineMidX = ((rShoulder.x + lShoulder.x) / 2) * canvas.width;
          const spineMidY = ((rShoulder.y + lShoulder.y) / 2) * canvas.height;
          
          const shoulderWidth = Math.hypot((rShoulder.x - lShoulder.x) * canvas.width, (rShoulder.y - lShoulder.y) * canvas.height);
          
          let trueC7X = spineMidX;
          let trueC7Y = spineMidY - (shoulderWidth * 0.08);

          // Fallback if shoulder width is too small (perfect side profile)
          if (shoulderWidth < (canvas.width * 0.05)) {
             const activeShoulder = useRightSide ? rShoulder : lShoulder;
             trueC7X = activeShoulder.x * canvas.width;
             trueC7Y = (activeShoulder.y * canvas.height) - (canvas.height * 0.02);
          }

          // 2. High Precision Tragus
          const activeTragus = useRightSide ? rTragus : lTragus;
          const trueTragusX = activeTragus.x * canvas.width;
          const trueTragusY = activeTragus.y * canvas.height;

          metrics.side = (trueTragusX < trueC7X) ? "LEFT" : "RIGHT"; 
          rawNodes = { c7: {x: Math.round(trueC7X), y: Math.round(trueC7Y)}, tragus: {x: Math.round(trueTragusX), y: Math.round(trueTragusY)} };

          const cvaDx = Math.abs(trueTragusX - trueC7X);
          const cvaDy = trueC7Y - trueTragusY;
          metrics.m1 = Math.round(Math.atan2(cvaDy, cvaDx) * (180 / Math.PI)); 

          // Displacement Normalization
          const activeHip = useRightSide ? rHip : lHip;
          const hipX = activeHip.x * canvas.width, hipY = activeHip.y * canvas.height;
          const torsoLength = Math.hypot(hipX - trueC7X, hipY - trueC7Y);
          
          metrics.raw2 = (cvaDx / torsoLength).toFixed(2);
          metrics.m2 = metrics.raw2; 

          // Horizon Line
          ctx.strokeStyle = 'rgba(255, 255, 255, 0.4)'; ctx.beginPath(); 
          ctx.moveTo(trueC7X, trueC7Y); 
          ctx.lineTo(trueTragusX < trueC7X ? trueC7X - 100 : trueC7X + 100, trueC7Y); 
          ctx.stroke();

          // Neck Vector
          ctx.strokeStyle = '#00ff9d'; ctx.beginPath(); ctx.moveTo(trueC7X, trueC7Y); ctx.lineTo(trueTragusX, trueTragusY); ctx.stroke();
          
          // Nodes: C7 is Magenta, Tragus is Cyan
          ctx.fillStyle = '#ff00ff'; ctx.beginPath(); ctx.arc(trueC7X, trueC7Y, radius, 0, 2*Math.PI); ctx.fill();
          ctx.fillStyle = '#00f0ff'; ctx.beginPath(); ctx.arc(trueTragusX, trueTragusY, radius, 0, 2*Math.PI); ctx.fill();

          val1.innerText = `${metrics.m1}°`; val2.innerText = `${metrics.m2}`;

        } else {
          // --- CORONAL HOLISTIC ENGINE ---
          const rAcroRaw = poseLms[12], lAcroRaw = poseLms[11];
          const rTragus = faceLms[234], lTragus = faceLms[454];
          const noseBridge = faceLms[168]; 
          
          minConfidence = Math.min(rAcroRaw.visibility, lAcroRaw.visibility);

          const torsoMockLength = Math.hypot((poseLms[24].x - rAcroRaw.x)*canvas.width, (poseLms[24].y - rAcroRaw.y)*canvas.height);

          const raX = rAcroRaw.x * canvas.width, raY = (rAcroRaw.y * canvas.height) - (torsoMockLength * 0.04);
          const laX = lAcroRaw.x * canvas.width, laY = (lAcroRaw.y * canvas.height) - (torsoMockLength * 0.04);
          
          const reX = rTragus.x * canvas.width, reY = rTragus.y * canvas.height;
          const leX = lTragus.x * canvas.width, leY = lTragus.y * canvas.height;

          const bridgeX = noseBridge.x * canvas.width;
          const bridgeY = noseBridge.y * canvas.height;

          metrics.side = "FRONTAL";

          const slopeDy = Math.abs(raY - laY);
          const slopeDx = Math.abs(raX - laX);
          metrics.m1 = Math.round(Math.atan2(slopeDy, slopeDx) * (180 / Math.PI));

          const headMidX = (reX + leX) / 2;
          const neckMidX = (raX + laX) / 2;
          const shoulderWidth = Math.abs(raX - laX);
          
          metrics.raw2 = (Math.abs(headMidX - neckMidX) / shoulderWidth).toFixed(3);
          metrics.m2 = metrics.raw2; 

          ctx.strokeStyle = 'rgba(255, 255, 255, 0.6)'; ctx.setLineDash([8, 8]);
          ctx.beginPath(); ctx.moveTo(bridgeX, 0); ctx.lineTo(bridgeX, canvas.height); ctx.stroke();
          ctx.setLineDash([]);

          ctx.strokeStyle = '#00ff9d'; ctx.beginPath(); ctx.moveTo(laX, laY); ctx.lineTo(raX, raY); ctx.stroke();
          ctx.strokeStyle = '#00f0ff'; ctx.beginPath(); ctx.moveTo(leX, leY); ctx.lineTo(reX, reY); ctx.stroke();
          
          ctx.fillStyle = '#fff';
          [ {x:raX, y:raY}, {x:laX, y:laY}, {x:reX, y:reY}, {x:leX, y:leY}, {x:bridgeX, y:bridgeY} ].forEach(pt => { ctx.beginPath(); ctx.arc(pt.x, pt.y, radius, 0, 2*Math.PI); ctx.fill(); });
          
          val1.innerText = `${metrics.m1}°`; val2.innerText = `${metrics.m2}`;
        }

        metrics.confidence = Math.round(minConfidence * 100);
        valConf.innerText = `${metrics.confidence}%`;

        if(metrics.confidence < 85) {
            valConf.classList.add('low');
            warningBanner.style.display = 'block';
            saveBtn.disabled = true; saveBtn.className = 'export-btn error'; saveBtn.innerText = "LOCKED: MARGIN OF ERROR TOO HIGH";
        } else {
            valConf.classList.remove('low');
            warningBanner.style.display = 'none';
            saveBtn.disabled = false; saveBtn.className = 'export-btn active'; saveBtn.innerText = "GENERATE CLINICAL PDF";
        }
      } else {
        resetMetrics();
        valConf.innerText = "ERR";
        warningBanner.innerText = "⚠ SYSTEM ERROR: NO FACIAL MESH DETECTED";
        warningBanner.style.display = 'block';
      }
    });

    saveBtn.addEventListener('click', () => {
      if (metrics.m1 === null || metrics.confidence < 85) return;
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF();
      const pId = (patientIdInput.value.trim()) || "ANON";
      const timeSafe = new Date().toISOString().replace(/[:.]/g, '-');
      const dateStr = new Date().toLocaleString();

      let severity = "OPTIMAL ALIGNMENT"; let sevColor = [0, 150, 50]; 
      let m1Name = "", m2Name = "", norm1 = "", norm2 = "", feedbackStr = "";

      if(currentMode === 'SAGITTAL') {
          m1Name = "Craniovertebral Angle (CVA)"; m2Name = "Torso-Normalized FHP Ratio";
          norm1 = ">= 50.0° (Optimal)"; norm2 = "Baseline Scale Variant";
          if (metrics.m1 < 50 && metrics.m1 >= 45) { severity = "MILD FORWARD HEAD POSTURE"; sevColor = [200, 150, 0]; feedbackStr = "Detected mild deviation. Recommend continuous monitoring and cervical retraction exercises."; }
          if (metrics.m1 < 45) { severity = "SEVERE DEVIATION (FHP)"; sevColor = [200, 0, 0]; feedbackStr = "Detected high deviation. Significant forward head posture noted. Evaluation advised."; }
          if (metrics.m1 >= 50) { feedbackStr = "Patient falls within optimal sagittal alignment parameters."; }
      } else {
          m1Name = "Shoulder Slope"; m2Name = "Asymmetry Index (Head Tilt Ratio)";
          norm1 = "< 3.0° (Symmetrical)"; norm2 = "Index < 0.05";
          if (metrics.m1 >= 3 || metrics.raw2 >= 0.05) { severity = "ASYMMETRY DETECTED"; sevColor = [200, 100, 0]; feedbackStr = "Detected lateral head tilt or shoulder drop. Consider evaluating unilateral muscle tension."; }
          else { feedbackStr = "Patient demonstrates solid coronal symmetry and leveling."; }
      }

      doc.setFillColor(255, 255, 255); doc.rect(0, 0, 210, 297, 'F');
      doc.setFillColor(0, 200, 200); doc.rect(0, 0, 210, 15, 'F');
      doc.setTextColor(30, 40, 50); doc.setFont("helvetica", "bold"); doc.setFontSize(22);
      doc.text("CLINICAL POSTURE REPORT", 20, 30);
      
      doc.setFont("helvetica", "normal"); doc.setFontSize(10); doc.setTextColor(80, 90, 100);
      doc.text(`Subject ID: ${pId}   |   Date: ${dateStr}   |   Mode: ${currentMode}`, 20, 38);

      const imgData = canvas.toDataURL('image/jpeg', 1.0);
      const pdfWidth = 100; const pdfHeight = (canvas.height / canvas.width) * pdfWidth;
      doc.setDrawColor(200, 200, 200); doc.setLineWidth(0.5); doc.rect(54, 44, pdfWidth + 2, pdfHeight + 2);
      doc.addImage(imgData, 'JPEG', 55, 45, pdfWidth, pdfHeight);

      const tableY = 45 + pdfHeight + 15;
      
      doc.setFillColor(245, 245, 250); doc.rect(20, tableY, 170, 16, 'F');
      doc.setTextColor(30, 40, 50); doc.setFont("helvetica", "bold"); doc.setFontSize(12);
      doc.text("ZONE INDICATION:", 25, tableY + 11);
      doc.setTextColor(sevColor[0], sevColor[1], sevColor[2]);
      doc.text(severity, 75, tableY + 11);

      const dataY = tableY + 25;
      doc.setTextColor(30, 40, 50); doc.setFont("helvetica", "bold"); doc.setFontSize(14);
      doc.text("I. CALIBRATION METRICS", 20, dataY);
      doc.setDrawColor(0, 200, 200); doc.line(20, dataY + 3, 190, dataY + 3);

      doc.setFontSize(10); doc.setTextColor(80, 90, 100); doc.setFont("helvetica", "normal");
      doc.text(m1Name, 25, dataY + 13);
      doc.setFont("helvetica", "bold"); doc.setTextColor(0,0,0); doc.text(`${metrics.m1}°`, 95, dataY + 13);
      doc.setFont("helvetica", "normal"); doc.setTextColor(80, 90, 100); doc.text(norm1, 130, dataY + 13);

      doc.text(m2Name, 25, dataY + 23);
      doc.setFont("helvetica", "bold"); doc.setTextColor(0,0,0); doc.text(`${metrics.m2}`, 95, dataY + 23);
      doc.setFont("helvetica", "normal"); doc.setTextColor(80, 90, 100); doc.text(norm2, 130, dataY + 23);
      
      doc.text("AI Telemetry Confidence:", 25, dataY + 33);
      doc.setFont("helvetica", "bold"); doc.setTextColor(0, 150, 50); doc.text(`${metrics.confidence}%`, 95, dataY + 33);
      doc.setFont("helvetica", "normal"); doc.setTextColor(80, 90, 100); doc.text("Passes >= 85% Threshold", 130, dataY + 33);

      doc.setTextColor(30, 40, 50); doc.setFont("helvetica", "bold"); doc.setFontSize(14);
      doc.text("II. CLINICAL FEEDBACK", 20, dataY + 50);
      doc.setDrawColor(0, 200, 200); doc.line(20, dataY + 53, 190, dataY + 53);
      
      doc.setFontSize(10); doc.setTextColor(80, 90, 100); doc.setFont("helvetica", "italic");
      doc.text(`"${feedbackStr}"`, 25, dataY + 63);

      doc.save(`Clinical_Report_${currentMode}_${pId}_${timeSafe}.pdf`);
      
      const originalText = saveBtn.innerText; saveBtn.innerText = "PDF GENERATED";
      setTimeout(() => { saveBtn.innerText = originalText; }, 2000);
    });
  </script>
</body>
</html>
